   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="175.536" y="260.345847" transform="rotate(-0 175.536 260.345847)">Original model</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(138.902367 294.41055)">TinyLlama 1.1B</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(153.590258 307.23555)">22 layers</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(132.492836 320.980863)">2.20 GB at 16 bits</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="343.494" y="260.345847" transform="rotate(-0 343.494 260.345847)">Stage 0  (done)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(306.999156 287.99805)">Sensitivity plan</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(294.827281 300.82305)">Tests each layer and</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(297.562242 313.64805)">writes one plan per</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(317.830641 326.47305)">later stage</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="573.948" y="179.758597" transform="rotate(-0 573.948 179.758597)">Stage 1  (planned)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(510.042125 208.406714)">Weights: the stored numbers</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(506.835625 220.286714)">GPTQ, AWQ, pruning, low-rank</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="573.948" y="285.094597" transform="rotate(-0 573.948 285.094597)">Stage 2  (planned)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(510.309562 307.802714)">Activations: numbers passed</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(540.191062 319.682714)">between layers</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(483.972125 331.562714)">SmoothQuant, QuaRot, RPTQ, SpinQuant</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="573.948" y="390.430597" transform="rotate(-0 573.948 390.430597)">Stage 3  (planned)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(507.615937 413.138714)">KV cache: short-term memory</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(545.851937 425.018714)">while writing</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(496.14225 436.821026)">QuaRot KV, KVQuant, H2O, SnapKV</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="812.214" y="260.345847" transform="rotate(-0 812.214 260.345847)">Stage 4  (planned)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(769.213883 295.330863)">Evaluation on real</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(754.632867 307.23555)">software: HF, llama.cpp,</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(765.105133 320.350003)">vLLM, TensorRT-LLM</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="581.76" y="99.703237" transform="rotate(-0 581.76 99.703237)">Search  (planned)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(434.294688 111.497594)">Tries many settings (threshold, share removed, group size, ...) with</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(401.31875 123.377594)">MOBO, MFBO and NSGA-III; keeps the best trade-offs of accuracy, memory, speed</text>
   </g>
   <g id="patch_17">
    <path d="M 297.998445 402.257632 
Q 320.070065 378.189807 342.141685 354.121982 
" style="fill: none; stroke: #009e73; stroke-linecap: round"/>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #009e73" transform="translate(223.293375 413.473379)">Fragile layers get more bits</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #009e73" transform="translate(225.971578 424.27584)">and are never thinned out</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="17.837812" transform="rotate(-0 7.2 17.837812)">Figure 1. The framework at a glance</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #444444" x="7.2" y="37.296" transform="rotate(-0 7.2 37.296)">Measure once which parts of the model are fragile, then compress each part only as hard as it can take.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(7.2 552.239437)">Solid green = built and tested.  Grey dashed = planned.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(7.2 564.839437)">Stages 1-3 each start from the original model plus the Stage 0 plan, so each kind of compression is measured on its own.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(7.2 577.439437)">Every stage compares three versions under identical conditions: the original model, the standard method, and the method guided by Stage 0.</text>
  </g>
 </g>
