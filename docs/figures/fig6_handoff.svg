    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="503.64" y="251.073399" transform="rotate(-0 503.64 251.073399)">Stage 0 results</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(454.363945 279.017526)">TinyLlama, 22 layers</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(434.115586 291.842526)">Perplexity 10.18 (tuning half)</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(415.157891 305.028972)">10.62 (held-out half, never tuned on)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="253.656" y="108.615109" transform="rotate(-0 253.656 108.615109)">Stage 1: weights</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(203.664437 125.840595)">compression_plan.json</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(189.723312 137.84297)">11 layers protected at 8 bits;</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(194.579125 149.72297)">0, 1, 2, 7, 21 never pruned</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(180.924688 161.60297)">942 MB plan vs 777 MB standard</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(176.2435 173.48297)">(+ two 768 / 766 MB budget plans)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="753.624" y="108.615109" transform="rotate(-0 753.624 108.615109)">Stage 2: activations</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(709.738125 131.780595)">activation_plan.json</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(685.142125 143.78297)">8 or 4 bits per layer, average 6</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(678.827437 155.66297)">Predicted rise 0.56 vs 0.67 copied</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(709.366188 167.54297)">Layer 1 most fragile</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="253.656" y="401.338309" transform="rotate(-0 253.656 401.338309)">Stage 3: KV cache</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(211.178812 424.503795)">kv_cache_plan.json</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(173.987813 436.50617)">Keys/values 4 bits (layer 0 values 2)</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(186.72925 448.38617)">Words kept 10-100% per layer</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(190.091813 460.26617)">13.0 MB -&gt; 3.2 MB predicted</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="753.624" y="401.338309" transform="rotate(-0 753.624 401.338309)">Stage 4 and search</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(676.796563 424.503795)">results.json, sensitivity_profile.json</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(674.993938 436.50617)">Reference: 47 ms to read a prompt,</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(666.780375 448.38617)">46 ms per word, 2.45 GB peak memory</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(677.710938 460.26617)">Cached profile: trials re-plan in ms</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(408.696328 364.461539)">Each stage starts from the original model,</text>
