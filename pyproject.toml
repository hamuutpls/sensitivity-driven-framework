[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdf"
version = "0.1.0"
description = "Sensitivity-driven adaptive LLM compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.56",  # AttentionInterface + masking_utils (Stage 3), lazy StaticCache
    "datasets>=2.18",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
downstream = ["lm-eval>=0.4"]  # eval.downstream_tasks
figures = ["matplotlib>=3.7"]  # Stage 0 joint curve figures
search = ["optuna>=5", "pymoo>=0.6"]  # MODE "search": MOBO (Optuna) and NSGA-III (pymoo)

[project.scripts]
sdf-stage0 = "sdf.cli:stage0_main"
sdf-stage0-sweep = "sdf.cli:sweep_main"
sdf-search-report = "sdf.cli:search_report_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
