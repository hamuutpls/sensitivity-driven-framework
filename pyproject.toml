[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdf"
version = "0.1.0"
description = "Sensitivity-driven adaptive LLM compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
downstream = ["lm-eval>=0.4"]  # eval.downstream_tasks
figures = ["matplotlib>=3.7"]  # Stage 0 joint curve figures

[project.scripts]
sdf-stage0 = "sdf.cli:stage0_main"
sdf-stage0-sweep = "sdf.cli:sweep_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
